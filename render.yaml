# Render Blueprint — deploys the backend and frontend as two independent web
# services, wired together with Render-managed environment variables.
# See https://render.com/docs/blueprint-spec
#
# Usage: push this repo to GitHub/GitLab, then in the Render Dashboard choose
# New > Blueprint and point it at the repo. Render reads this file automatically.
#
# Note: the CORS_ORIGINS / FRONTEND_URL / VITE_API_URL cross-references below
# are filled in once both services exist. On the very first deploy they may be
# blank; trigger one manual redeploy of each service afterward to pick them up.

databases:
  - name: aevona-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: aevona-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aevona-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          name: aevona-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          name: aevona-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_GOOGLE_EMAILS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Aevona Solutions
      - key: SMTP_USE_SSL
        value: "false"

  - type: web
    name: aevona-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          name: aevona-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_URL
        fromService:
          name: aevona-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        fromService:
          name: aevona-backend
          type: web
          envVarKey: GOOGLE_CLIENT_ID
